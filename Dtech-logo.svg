<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 249" width="256" height="249">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d8d8"/>
      <stop offset=".45" stop-color="#8d8d8d"/>
      <stop offset="1" stop-color="#5b5b5b"/>
    </linearGradient>

    <linearGradient id="face" x1=".2" y1=".05" x2=".85" y2=".95">
      <stop offset="0" stop-color="#303030"/>
      <stop offset=".55" stop-color="#202020"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>

    <linearGradient id="purple" x1=".15" y1=".1" x2=".8" y2=".9">
      <stop offset="0" stop-color="#6333a8"/>
      <stop offset=".55" stop-color="#4e2790"/>
      <stop offset="1" stop-color="#412078"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".45"/>
    </filter>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Outer metallic edge -->
  <g transform="rotate(-31 128 124)" filter="url(#shadow)">
    <rect x="14" y="20" width="228" height="207" rx="43"
          fill="url(#rim)" stroke="#707070" stroke-width="2"/>

    <!-- Dark face -->
    <rect x="18" y="17" width="220" height="205" rx="40"
          fill="url(#face)" stroke="#111" stroke-width="2"/>

    <!-- subtle top highlight -->
    <path d="M49 23h151c18 0 32 11 36 28"
          fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"
          opacity=".42" filter="url(#soft)"/>

    <!-- Purple D -->
    <path fill="url(#purple)" fill-rule="evenodd"
      d="M57 62
         H126
         C164 62 194 88 194 121
         C194 157 166 181 126 181
         H57
         Z

         M104 91
         V152
         H123
         C141 152 151 141 151 122
         C151 103 141 91 123 91
         Z"/>

    <!-- faint D edge -->
    <path d="M57 62H126C164 62 194 88 194 121C194 157 166 181 126 181H57"
          fill="none" stroke="#7b4ac1" stroke-width="1" opacity=".35"/>
  </g>
</svg>